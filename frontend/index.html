<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedyBosh — Connexion</title>
<link rel="stylesheet" href="css/variables.css">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #00bcd4, #008c9e);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-body {
    background: linear-gradient(180deg, #00bcd4, #008c9e);
    width: 400px;
    margin: 100px auto;
    padding: 40px;
    border-radius: 15px;
    text-align: center;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  }
  .login-body .logo {
    width: 80px;
    margin-bottom: 10px;
  }
  .login-body h1 { font-size: 24px; margin: 10px 0 5px; }
  .login-body p { font-size: 14px; margin-bottom: 20px; opacity: 0.9; }
  .tabs {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    background-color: rgba(255,255,255,0.2);
    color: #fff;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
  }
  .tab.active {
    background-color: rgba(255,255,255,0.4);
    font-weight: bold;
  }
  form { display: none; flex-direction: column; gap: 10px; }
  form.active { display: flex; }
  input {
    width: 90%;
    padding: 10px;
    margin: 10px auto;
    border: none;
    border-radius: 5px;
    font-size: 14px;
  }
  button {
    width: 90%;
    padding: 12px;
    background-color: #007c8c;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    margin: 10px auto;
  }
  button:hover { background-color: #0099aa; }
  .error { color: #fff; font-size: 12px; min-height: 16px; text-align: center; margin: 5px auto; width: 90%; }
  .input-icon {
    position: relative;
    width: 90%;
    margin: 10px auto;
  }
  .input-icon .icon {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
  }
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background: linear-gradient(180deg, #00bcd4, #008c9e);
    color: #fff;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 320px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  #voice-prompt {
    font-size: 16px;
    margin-bottom: 15px;
  }
  .listening {
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  #close-modal {
    margin-top: 10px;
    background: rgba(255,255,255,0.3);
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  #talk-btn {
    background: #ff9800;
    color: #fff;
    font-weight: bold;
    border-radius: 20px;
    transition: background 0.3s;
  }
  #talk-btn:hover {
    background: #e68900;
  }
  #talk-btn.active, #talk-btn-register.active {
    animation: pulse-btn 1s infinite;
  }
  @keyframes pulse-btn {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    margin-top: 15px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #fff;
    width: 0%;
    transition: width 0.3s ease;
  }
  .mic-icon {
    font-size: 48px;
    margin-bottom: 15px;
  }
  .mic-icon.listening {
    animation: mic-pulse 1.5s infinite;
  }
  @keyframes mic-pulse {
    0% { transform: scale(1); opacity: 1; text-shadow: 0 0 0 rgba(255,255,255,0); }
    50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
    100% { transform: scale(1); opacity: 1; text-shadow: 0 0 0 rgba(255,255,255,0); }
  }
</style>
</head>
<body>
  <div class="login-body">
    <img src="img/speedybosh_logo2.png" alt="SpeedyBosh Logo" class="logo">
    <h1>SpeedyBosh</h1>
    <p>Writing emails by voice</p>

    <div class="tabs">
      <button id="tab-login" class="tab active">Se connecter</button>
      <button id="tab-register" class="tab">Créer un compte</button>
    </div>

    <form id="form-login" class="active">
      <div class="input-icon">
        <input type="email" id="login-email" placeholder="Email" required>
        <span class="icon">📷</span>
      </div>
      <input type="password" id="login-password" placeholder="Mot de passe" required>
      <div class="error" id="login-error"></div>
      <button type="submit">Se connecter</button>
      <button type="button" id="talk-btn">🎤 Talk</button>
    </form>

    <form id="form-register">
      <input type="text" id="reg-username" placeholder="Nom d'utilisateur" required>
      <div class="input-icon">
        <input type="email" id="reg-email" placeholder="Email" required>
        <span class="icon">📷</span>
      </div>
      <input type="password" id="reg-password" placeholder="Mot de passe" required>
      <div class="error" id="register-error"></div>
      <button type="submit">Créer mon compte</button>
      <button type="button" id="talk-btn-register">🎤 Talk</button>
    </form>
  </div>

  <!-- Fenêtre modale -->
  <div id="voice-modal" class="modal">
    <div class="modal-content">
      <div class="mic-icon">🎤</div>
      <p id="voice-prompt">Ready to talk...</p>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <button id="close-modal">✖</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/voice.js"></script>
  <script>
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("form-login");
    const formRegister = document.getElementById("form-register");

    tabLogin.onclick = () => {
      tabLogin.classList.add("active"); tabRegister.classList.remove("active");
      formLogin.classList.add("active"); formRegister.classList.remove("active");
    };
    tabRegister.onclick = () => {
      tabRegister.classList.add("active"); tabLogin.classList.remove("active");
      formRegister.classList.add("active"); formLogin.classList.remove("active");
    };

    // Redirige directement vers le dashboard si déjà connecté
    if (Api.getToken()) {
      Api.me().then(() => window.location.href = "dashboard.html").catch(() => Api.clearToken());
    }

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";
      try {
        await Api.login(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        errEl.textContent = err.message;
      }
    });

    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("reg-username").value;
      const email = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;
      const errEl = document.getElementById("register-error");
      errEl.textContent = "";
      try {
        await Api.register(username, email, password);
        await Api.login(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        errEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
